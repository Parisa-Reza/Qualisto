services:

  postgres:
    image: postgres:17
    container_name: presto_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .
    container_name: presto_web
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "


volumes:
  postgres_data: