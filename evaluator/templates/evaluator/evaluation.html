<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualisto - Website Evaluation</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'evaluator/css/style.css' %}">
</head>

<body>
    <div class="container">
        <!-- PAGE HEADER -->
        <header class="header">
            <h1>Qualisto</h1>
            <p>AI-powered webpage quality evaluation</p>
        </header>

        <!-- INPUT SECTION -->
        <section class="card evaluation-form-card">
            <h2>Evaluate Website</h2>
            <form id="evaluation-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="website-url">Website URL</label>
                    <input type="url" id="website-url" name="url" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="user-prompt">User Prompt</label>
                    <textarea id="user-prompt" name="user_prompt" rows="5"
                        placeholder="Create a travel webpage about Bali beaches and hotels." required></textarea>
                </div>
                <button type="submit" id="evaluate-button">Evaluate Website</button>
            </form>
            <div id="loading" class="loading hidden">Evaluating website...</div>
            <div id="error" class="error hidden"></div>
        </section>

        <!-- EVALUATION REPORT -->
        <section id="report" class="report hidden">
            <!-- OVERALL SCORE -->
            <div class="overall-section">
                <h2>Overall Score</h2>
                <div id="overall-score" class="overall-score">0/100</div>
            </div>

            <!-- USER INPUT SUMMARY -->
            <div class="request-summary">
                <div class="request-item">
                    <span class="request-label">Website URL</span>
                    <span id="report-url" class="request-value"></span>
                </div>
                <div class="request-item">
                    <span class="request-label">User Prompt</span>
                    <span id="report-prompt" class="request-value prompt-value"></span>
                </div>
            </div>

            <!-- FIVE MODULE SCORES -->
            <div id="score-grid" class="score-grid"></div>

            <!-- MODULE TABS -->
            <div id="module-tabs" class="module-tabs"></div>

            <!-- ACTIVE MODULE CONTENT -->
            <div id="active-module" class="active-module"></div>
        </section>
    </div>
    <script src="{% static 'evaluator/js/evaluation.js' %}"></script>
</body>

</html>
